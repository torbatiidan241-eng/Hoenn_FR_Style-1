name: Build Hoenn_FR_Style

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git Symlinks
        run: git config --global core.symlinks false

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi git libpng-dev zlib1g-dev pkg-config wget unzip

      - name: Build agbcc (if not present)
        run: |
          if [ ! -f "tools/agbcc/bin/agbcc" ]; then
            if [ -f "agbcc/build.sh" ]; then
              cd agbcc && ./build.sh && ./install.sh ..
            elif [ -f "tools/agbcc/build.sh" ]; then
              cd tools/agbcc && ./build.sh && ./install.sh ../..
            else
              git clone https://github.com/pret/agbcc.git /tmp/agbcc
              cd /tmp/agbcc && ./build.sh && ./install.sh "$GITHUB_WORKSPACE"
            fi
          fi

      - name: Build Tools
        run: |
          make tools -j$(nproc) || true

      - name: Build ROM
        run: |
          make -j$(nproc)

      - name: Upload Built ROM
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn_FR_Style-ROM
          path: |
            *.gba
            *.sym
            *.map
          if-no-files-found: error